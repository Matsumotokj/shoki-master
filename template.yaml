# 書記マスター（shoki-master）のインフラ定義
#
# このファイルが AWS 上のリソースの「正」。コンソールや CLI で直接変更しない
# （変更するとこのファイルと実物が食い違い、次のデプロイで上書きされるか失敗する）。
#
# 現段階は保存先と API。配信（CloudFront）は後で足す。
#
#   sam validate --lint     書式の検査
#   sam build               Lambda に載せるコードと依存ライブラリをまとめる（.aws-sam/）
#   sam deploy              作成・更新（設定は samconfig.toml）
#   sam delete              スタックごと全部削除

AWSTemplateFormatVersion: "2010-09-09"
# この 1 行があると SAM の短縮記法（AWS::Serverless::*）が使える。
# デプロイ時に通常の CloudFormation に展開される。
Transform: AWS::Serverless-2016-10-31
# 値（Description など）は英語にする。Windows（cp932）から sam deploy すると、
# 値の中の日本語が CloudFormation に届く前に「?」に化けるため。コメントは影響しない。
Description: Shoki Master - listening, transcription and summarization practice

Parameters:
  # 予算（月 $7・通知メール付き）はアカウント全体の費用監視として手作業で作成済み。
  # 通知先のメールアドレスをリポジトリに載せないため、予算自体はこのテンプレートに入れない
  BudgetName:
    Type: String
    Default: shoki-master-monthly
    Description: Existing AWS Budgets budget that triggers the stop action

Resources:
  # ---------------------------------------------------------------------------
  # 問題（題材・文ごとの開始位置・音声の場所）
  # アクセスパターン: problem_id を指定して 1 件取る → パーティションキーだけ
  # ---------------------------------------------------------------------------
  ProblemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-problems
      # キーに使う属性だけを宣言する（text や sentences は書かない）
      AttributeDefinitions:
        - AttributeName: problem_id
          AttributeType: S
      KeySchema:
        - AttributeName: problem_id
          KeyType: HASH
      # オンデマンド。読み書きした分だけ課金、アクセスが無ければ 0
      BillingMode: PAY_PER_REQUEST
      # 作成とは別の設定だった TTL。属性名はアプリ（repositories/problems.py）と一致させる
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------------------------------------------------------------------
  # 回答（同じ問題に何度でも。要件 F3-4）
  # アクセスパターン: ある問題への回答を新しい順に取る → PK + SK
  # ---------------------------------------------------------------------------
  AttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-attempts
      AttributeDefinitions:
        - AttributeName: problem_id
          AttributeType: S
        - AttributeName: attempt_id
          AttributeType: S
      KeySchema:
        - AttributeName: problem_id
          KeyType: HASH
        - AttributeName: attempt_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------------------------------------------------------------------
  # 作問数のカウンタ（日次・月次の上限。要件 N2-3）
  # ---------------------------------------------------------------------------
  CountersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-counters
      AttributeDefinitions:
        - AttributeName: counter_id
          AttributeType: S
      KeySchema:
        - AttributeName: counter_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------------------------------------------------------------------
  # 生成した音声（使い捨て。1 日で自動削除）
  # ---------------------------------------------------------------------------
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      # アカウントのリージョナル名前空間。CloudFormation が
      # 「-<アカウントID>-<リージョン>-an」を自動で付ける
      BucketNamespace: account-regional
      BucketNamePrefix: !Sub ${AWS::StackName}-audio
      # 非公開。配信は署名付き URL で行う（要件 N3-2）
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # バージョニングは付けない。使い捨ての音声に旧版は不要で、
      # 有効だと削除のたびに版を 1 つずつ消す必要が出る
      LifecycleConfiguration:
        Rules:
          - Id: delete-after-1-day
            Status: Enabled
            ExpirationInDays: 1

  # ---------------------------------------------------------------------------
  # API の入口（API Gateway の HTTP API）
  # REST API より安く、今回使わない機能（API キー、リクエスト変換など）を持たない
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # 全ルート共通の流量制限。人が練習する速さには十分で、連打や機械的な
      # 大量アクセスはここで弾く（要件 N2-3）。超えると 429 が返る
      DefaultRouteSettings:
        ThrottlingRateLimit: 2
        ThrottlingBurstLimit: 5

  # ---------------------------------------------------------------------------
  # API 本体（FastAPI を 1 つの Lambda に載せる）
  # ---------------------------------------------------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # backend/ の中身と requirements.txt のライブラリをまとめて載せる
      CodeUri: backend/
      Handler: app.main.handler
      Runtime: python3.14
      # Graviton（ARM）。同じ性能で x86 より 2 割ほど安い
      Architectures:
        - arm64
      # メモリに比例して CPU も割り当てられる。起動時の import が速くなる
      MemorySize: 512
      # HTTP API が待てるのは最大 30 秒。それより先に Lambda 側で打ち切る。
      # 作問は実測 8.8 秒（271 字）、最悪でも 20 秒程度の見込み
      Timeout: 29
      # 同時実行数の予約（ReservedConcurrentExecutions）は設定しない。
      # アカウントの上限が 10 で、AWS は予約されていない枠を最低 10 残すことを
      # 求めるため、1 つも予約できない。上限 10 自体が天井として働く
      Environment:
        Variables:
          PROBLEMS_TABLE: !Ref ProblemsTable
          ATTEMPTS_TABLE: !Ref AttemptsTable
          COUNTERS_TABLE: !Ref CountersTable
          AUDIO_BUCKET: !Ref AudioBucket
      # ログの出力先を下で定義したロググループにする。Lambda に自動で作らせると
      # スタックの管理外になり、スタックを消しても残る（インターンの後始末で経験）
      LoggingConfig:
        LogGroup: !Ref ApiFunctionLogGroup
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            # /api/ 以下だけを Lambda に渡す。/docs（Swagger UI）は公開しない
            Path: /api/{proxy+}
            Method: ANY
      # -----------------------------------------------------------------------
      # 実行ロール: この Lambda に許す操作。必要なものだけを、対象を絞って許可する
      # （ログの書き込みは SAM が自動で付ける）
      # -----------------------------------------------------------------------
      Policies:
        - Statement:
            # 題材生成・要約採点。日本国内完結の推論プロファイルは東京と大阪の
            # モデルに振り分けるので、プロファイルと両リージョンのモデルを許可する。
            # 東京だけだと「大阪に振り分けられたときだけ失敗する」不具合になる
            - Sid: InvokeClaudeInJapan
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/jp.anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:ap-northeast-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:ap-northeast-3::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0

            # 音声合成。Polly の音声合成は対象を絞る仕組みが無いため "*"
            - Sid: SynthesizeSpeech
              Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"

            # 問題: 保存と取得だけ（一覧・削除はしない）
            - Sid: ReadWriteProblems
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ProblemsTable.Arn

            # 回答: 保存だけ
            - Sid: WriteAttempts
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AttemptsTable.Arn

            # 作問数のカウンタ: 条件付きの加算だけ。TransactWriteItems には
            # 専用の権限が無く、中の各操作（ここでは UpdateItem）の権限で判定される
            - Sid: CountProblems
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt CountersTable.Arn

            # 音声: audio/ の下への保存と取得だけ。署名付き URL で配信するときも、
            # URL に署名したこのロールに GetObject の権限が要る
            - Sid: ReadWriteAudio
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub ${AudioBucket.Arn}/audio/*

  # ログの保存先。保持期間を決めておかないと無期限に溜まり、少しずつ課金が続く
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 14

  # ===========================================================================
  # 予算超過時の自動停止（要件 N2-3 の最後の層）
  #
  # 予算の実績が 100% に達すると、Budgets が API の実行ロールに下の
  # 拒否ポリシーを付ける。作問と要約の採点（Bedrock・Polly）が止まり、
  # 費用のかからない文字起こしの採点だけが動き続ける。
  #
  # 翌月になっても自動では外れない。原因を確認してから手動で戻す:
  #   aws budgets describe-budget-actions-for-budget --account-id <ID> --budget-name <名前>
  #   aws budgets execute-budget-action ... --execution-type REVERSE_BUDGET_ACTION
  # ===========================================================================

  # 付けられる側: 費用のかかる呼び出しだけを拒否する。
  # 拒否（Deny）は許可（Allow）より常に優先されるので、実行ロールの許可を
  # 書き換えずに、付け外しだけで止めたり戻したりできる
  StopGenerationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Attached by AWS Budgets when the monthly budget is exhausted
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StopPaidAiCalls
            Effect: Deny
            Action:
              - bedrock:InvokeModel
              - polly:SynthesizeSpeech
            Resource: "*"

  # 付ける側: Budgets が引き受けるロール。
  # 「API の実行ロールに、上の拒否ポリシーを付け外しすること」だけを許す
  BudgetActionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sts:AssumeRole
            # 他のアカウントの予算からこのロールを使わせない（混乱した代理問題の対策）
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:budgets::${AWS::AccountId}:budget/*
      Policies:
        - PolicyName: attach-stop-policy-to-api-role
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !GetAtt ApiFunctionRole.Arn
                # 付け外しできるのは上の拒否ポリシーだけ（管理者権限などは付けられない）
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Ref StopGenerationPolicy

  # 停止したことの通知先。メールアドレスをリポジトリに載せないため SNS トピックにする。
  # 予算 100% のメール通知は既存の予算から届く。停止の通知もメールで受けたければ、
  # このトピックにメールの購読を手作業で 1 回追加する
  BudgetAlertTopic:
    Type: AWS::SNS::Topic

  BudgetAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref BudgetAlertTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BudgetAlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  BudgetStopAction:
    Type: AWS::Budgets::BudgetsAction
    DependsOn: BudgetAlertTopicPolicy
    Properties:
      BudgetName: !Ref BudgetName
      NotificationType: ACTUAL
      ActionThreshold:
        Type: PERCENTAGE
        Value: 100
      ActionType: APPLY_IAM_POLICY
      # 承認を待たずに自動で実行する（夜中に超えても止まるように）
      ApprovalModel: AUTOMATIC
      ExecutionRoleArn: !GetAtt BudgetActionRole.Arn
      Definition:
        IamActionDefinition:
          PolicyArn: !Ref StopGenerationPolicy
          Roles:
            - !Ref ApiFunctionRole
      Subscribers:
        - Type: SNS
          Address: !Ref BudgetAlertTopic

Outputs:
  ApiUrl:
    Description: Base URL of the API (append /api/health, /api/problems, ...)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com

  # ローカル開発ではこの値を環境変数に入れて、同じリソースに接続する
  ProblemsTableName:
    Value: !Ref ProblemsTable
  AttemptsTableName:
    Value: !Ref AttemptsTable
  CountersTableName:
    Value: !Ref CountersTable
  AudioBucketName:
    Value: !Ref AudioBucket
