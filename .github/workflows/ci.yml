# CI: push とプルリクエストのたびに、テスト・型チェック・ビルド・テンプレートの検査を走らせる。
# AWS には入らない（テストは課金サービスを呼ばない作り。backend/tests/conftest.py）ので、
# GitHub に AWS の資格情報を渡していない。デプロイは手元で行う
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチに続けて push したら、古いほうの実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# このワークフローに許すのは、リポジトリの読み取りだけ
permissions:
  contents: read

jobs:
  backend:
    name: バックエンド（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Lambda と同じ Python 3.14
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: フロント（型チェック・vitest・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # package-lock.json のとおりに入れる（npm install と違い、lock を書き換えない）
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  template:
    name: テンプレート（cfn-lint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # sam validate --lint の中身と同じ検査。SAM CLI を入れずに済むよう、cfn-lint を直接使う
      - run: pip install cfn-lint==1.57.1
      - run: cfn-lint template.yaml
